# The suite, on both platforms, on every push and every pull request.
#
# `task-1804` §2.3: there was no `.github/` directory at all, and every number in that document
# existed because a person ran the commands on one machine. That is workable for one developer and it
# is not workable for a release — nothing catches a change that breaks the macOS build, and nothing
# stops a regression reaching a tag.
#
# ## Why the split, and what each job is really for
#
# The platform split is what makes this more than a formality. **The screenshot baselines are
# per-platform** — macOS reads `crates/unluminate-app/tests/snapshots`, Windows
# `tests/snapshots/windows` — so before this each set was only ever verified on whichever machine
# happened to be running, and a change that broke the other platform's rendering was found by whoever
# next opened the other platform.
#
# So there are three jobs and they answer three different questions:
#
# - **`checks`** is the cheap one and runs first: does it build, is it formatted, does clippy pass,
#   is the reference documentation in step with the catalogue, and does `CHANGELOG.md` still say what
#   the history says. It is the whole `unluminate-cli` contract and it needs no graphics card.
# - **`suite`** runs everything that does not need a window, on both platforms. 1,295 of the tests
#   are here and they are the editor's text buffer, the terminal's emulation, git, the debug adapter
#   protocol, the database wire protocols and the chat client.
# - **`screenshots`** runs the window through `wgpu`, on both platforms, against that platform's own
#   accepted images.
#
# ## The macOS baselines
#
# **The macOS screenshot job is expected to fail until somebody accepts that platform's images once.**
# It is stated here rather than hidden behind `continue-on-error`, because a job that is allowed to
# fail is a job nobody reads. The baselines in `tests/snapshots` were last accepted on a Mac before
# `task-1804`, which changed the status bar, the menu bar and the Find in Files modal — so they are
# stale in exactly the way this workflow exists to make visible. The repair is one run of
# `UPDATE_SNAPSHOTS=1 cargo test -p unluminate-app --test screenshots` on a Mac, with somebody opening
# the images, which is the rule `CLAUDE.md` sets and which a CI runner cannot keep.
#
# ## What is not here
#
# `crates/unluminate-app/tests/agent_board.rs` — the six end-to-end tests that start a real agent.
# They cost money and minutes and are `#[ignore]`d; `nightly.yml` is where they run.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A backtrace on the one run nobody can reproduce is worth more than the noise it costs.
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: Build, format, clippy and the written reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The window's own dependencies, which the CLI crate does not need but the workspace build does.
      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev pkg-config
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy -p unluminate-core -p unluminate-cli -p unluminate-terminal -p unluminate-git -p unluminate-dap -p unluminate-db -p unluminate-chat -- -D warnings
      # `unluminate-cli/src/documentation.rs` fails while a command has no section in commands.md,
      # while a usage line is stale, or while a section describes a command that has gone. It is the
      # one test that keeps the document handed to an agent from drifting from the catalogue.
      - name: The written reference is in step with the catalogue
        run: cargo test -p unluminate-cli
      - name: CHANGELOG.md says what the history says
        run: node tools/changelog.mjs --check

  suite:
    name: The suite with no window (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace --exclude unluminate-app
        run: cargo test --workspace --exclude unluminate-app
      # The window's own unit tests: the file tree, the fonts, the settings file, the menus and the
      # key encoding. No graphics card, so they run wherever the crate builds.
      - name: cargo test -p unluminate-app --lib --bins
        run: cargo test -p unluminate-app --lib --bins

  screenshots:
    name: The window through wgpu (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test -p unluminate-app --test screenshots
        run: cargo test -p unluminate-app --test screenshots
      # What was rendered, so a failure can be looked at rather than guessed at. `.new.png` is what
      # the run produced and `.diff.png` is where it differs, which is how a person decides whether a
      # change was meant.
      - name: Keep the images a failing run produced
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: |
            crates/unluminate-app/tests/snapshots/**/*.new.png
            crates/unluminate-app/tests/snapshots/**/*.diff.png
          if-no-files-found: ignore
