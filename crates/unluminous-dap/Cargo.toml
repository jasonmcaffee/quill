[package]
name = "unluminous-dap"
description = "A Debug Adapter Protocol client: the framing, the messages, the session, and the thread it runs on. No user interface dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The protocol is Content-Length framed JSON. Read and written as values rather than through derive
# macros, which is the choice `unluminous-cli/src/protocol.rs` already made and for the same reason: this
# is an open protocol other people's programs speak, so what crosses the wire is a value rather than
# a Rust type that happens to serialise.
serde_json.workspace = true
