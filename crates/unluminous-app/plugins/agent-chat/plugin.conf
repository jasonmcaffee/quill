# An Unluminous plugin that draws. See the JavaScript one for what a language plugin is; this one adds a
# pane, a menu and a Settings page instead of a file type.
#
# `ui.provider` names code that shipped inside Unluminous. The arrangement below is data and can be changed
# by hand; the drawing cannot, which is what stops a manifest deciding the window's colours.

plugin.id          = agent-chat
plugin.name        = Agent-Chat
plugin.version     = 1.0.0
plugin.vendor      = Unluminous
plugin.kind        = ui
plugin.description = A chat pane beside your work, talking to the `claude` or `codex` command line already installed on this machine. The answer arrives as it is written — a token at a time from `claude`, a paragraph at a time from `codex`, which is the shape of what each one sends. The agent uses its own tools in the project this window has open, and a picture can be attached to what you send. A row can be pointed at a URL instead.
plugin.limitations = The two rows that ship run a program rather than sending to an address, so **Unluminous holds no key for them at all** and neither is offered Unluminous's own commands: `claude` and `codex` bring their own tools, their own sandbox and their own account, and what this pane does with a tool call is show it. How much an agent may do is one setting with three values - `read` changes nothing, `edit` may change files in the open project, `full` may do anything with no sandbox - and it has to be chosen before the turn starts, because an agent run non-interactively cannot stop and ask. The two agents enforce it differently and the settings page says which: `codex` takes an operating system sandbox, and `claude` takes a permission mode, which is its own policy about its own tools rather than a limit on the process. An agent runs in the folder this window has open and reads that project's own instructions; nothing about the file you are looking at is sent except its path. A picture goes **up** only, by the button, by dragging a file onto the pane or by pasting one, and nothing comes back that way. Five shapes are spoken: `claude-cli` and `codex-cli` run a program, and `openai`, `anthropic` and `responses` send to a URL. A row that sends is the one that can be offered Unluminous's command catalogue - including, behind a second switch, the commands that run a program of the model's choosing - and it is the one that needs a key, which is never stored by Unluminous: it names an environment variable, or on macOS and Linux a keychain entry, and Windows has no keychain so the variable is the only route there. A shape none of the five covers cannot be added, and Gemini's own is not among them. Markdown in an answer is drawn with headings, lists, quotes, tables and coloured fenced code, and does not draw pictures or Mermaid diagrams written inside the text: resolving those needs the window to decode an image and lay a diagram out. A picture attached to a message is drawn. One conversation at a time, with a history to switch between them; a message cannot be edited and re-sent. Speech, the microphone, web search and the datasource chips of the page this pane is modelled on belong to that page's own server, which is nothing this pane talks to, so they are absent rather than present and refusing.

ui.provider = agent-chat

# The decoration `egui` cannot draw: soft shadows, inset shadows, gradients and rounded clips, rendered by
# `services::vello_canvas`. Named from `plugins::CHROME`, checked, and refused with the list if this version
# of Unluminous has no such renderer — the rule `language.renders`, `run.project` and `debug.adapter` all keep.
# Take this line out and the pane draws flat, in the same frame.
ui.chrome = vello

# The pane, docked to the right, with a button in the upper group of the rail. Both are what the
# ticket asks for in its first sentence, and both are data: dragging its header to another edge,
# `Move to` on its right click menu and `unluminous-cli plugins pane agent-chat/chat --side bottom` all
# work with no code here, because `task-1697` built them for every panel.
pane.id      = chat
pane.label   = Agent-Chat
pane.icon    = chat
pane.side    = right
pane.group   = top
pane.width   = 420
pane.height  = 320
pane.applies = always

# The menu, added after Unluminous's own six. A lone `-` is a separator.
menu.name    = Agent-Chat
# `open-pane` is the window's own name for "put this plugin's pane on the screen": Unluminous acts on it
# in `run_plugin_command`, so the menu entry, the rail button and `unluminous-cli plugins run agent-chat
# open-pane` are one path.
menu.entries = open-pane=Show Chat, new=New Conversation, -, stop=Stop Answering, -, tools=Toggle Unluminous Tools

# The page in Settings, which is where a row's program — or its URL, model and key variable — goes.
settings.page = Agent-Chat
settings.icon = chat
