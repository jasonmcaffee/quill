# A Unluminate plugin that draws. See the JavaScript one for what a language plugin is; this one adds a
# pane, a tab, a menu and a Settings page instead of a file type.
#
# `ui.provider` names code that shipped inside Unluminate. The arrangement below is data and can be changed
# by hand; the drawing cannot, which is what stops a manifest deciding the window's colours.

plugin.id          = database
plugin.name        = Database
plugin.version     = 1.1.0
plugin.vendor      = Unluminate
plugin.kind        = ui
plugin.description = A database explorer: a tree of data sources, schemas, tables and columns down one side, and a workspace of query consoles and row editors in a tab. A console runs the statement under the caret and shows what came back. A row editor has a WHERE and an ORDER BY you type SQL into, pages through the rows, and lets you change them - double click a cell to type in it, and read the changes as the statements they will become before Save writes any of them. Right click the tree to make a table. PostgreSQL and SQLite.
plugin.limitations = Two engines, PostgreSQL and SQLite, and nothing else: a third would be a module beside them rather than a driver downloaded, because nothing in Unluminate is ever fetched. Unluminate never writes a password down - one you type goes into this machine's own credential store, which is the keychain on macOS, the Secret Service on Linux and Credential Manager on Windows, and what the settings file records is the name of the entry. A PostgreSQL connection speaks SCRAM-SHA-256, MD5 and a plain password; it does not speak Kerberos, GSSAPI or SSPI, and it does not implement SASLprep, so a password containing characters SASLprep would fold may be refused by the server. Connection security is off, if offered, or required, verified against this machine's own certificate store - there is no certificate file and no verify-full. A row can only be changed when it can be addressed: the rows have to come from one table with a primary key, or a SQLite table with a rowid, and otherwise the grid is read only and says why, because an UPDATE matching on every column quietly changes two identical rows. A console result is never editable. Every save is its own transaction and there is no manual transaction mode, because an editor that can leave a transaction open holds locks while nobody is looking at the window. The console is a text field with SQL colouring rather than a second copy of Unluminate's editor: it has selection, undo and the clipboard, and it has no folding, no multiple carets, no gutter and no find-in-file. Making a table is a dialog; altering one is a statement you write, and the DDL button shows you the one a table already has. So are charts, the geo viewer, transposed and tree view modes, the aggregate view, foreign-key navigation, and every export format but copying a result out.

ui.provider = database

# The decoration `egui` cannot draw: soft shadows, inset shadows, gradients and rounded clips, rendered by
# `services::vello_canvas`. Named from `plugins::CHROME`, checked, and refused with the list if this version
# of Unluminate has no such renderer - the rule `language.renders`, `run.project` and `debug.adapter` all keep.
# Take this line out and the plugin draws flat, in the same frame.
ui.chrome = vello

# The tree, docked to the right. One word, and `task-1697`'s docking moves it to any edge with no code
# in the plugin at all.
pane.id      = explorer
pane.label   = Database
pane.icon    = database
pane.side    = right
pane.group   = top
pane.width   = 340
pane.height  = 320
pane.applies = always

# The workspace: the consoles and the row editors, in a tab of the editing area. A console beside a
# 340 point tree would be a console nobody could read a result in - which is the reason `task-28` gave
# for the Agent-Tasks board being a tab as well.
tab.id    = workspace
tab.label = Database
tab.icon  = table

# The menu, added after Unluminate's own six. A lone `-` is a separator.
menu.name    = Database
# `open-pane` and `open-tab` are the window's own names for "put this plugin's pane, or its tab, on the
# screen": Unluminate acts on them in `run_plugin_command`, so the menu entry, the rail button and
# `unluminate-cli plugins run database open-pane` are one path.
menu.entries = open-pane=Show Databases, open-tab=Open Workspace, -, add-source=New Data Source, new-table=New Table, reload=Reload, -, submit=Save Changes

# The page in Settings, which is where a data source and the place its password lives are named.
settings.page = Database
settings.icon = database
