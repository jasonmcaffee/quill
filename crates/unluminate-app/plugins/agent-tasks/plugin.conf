# A Unluminate plugin that draws. See the JavaScript one for what a language plugin is; this one adds a
# pane, a tab, a menu and a Settings page instead of a file type.
#
# `ui.provider` names code that shipped inside Unluminate. The arrangement below is data and can be changed
# by hand; the drawing cannot, which is what stops a manifest deciding the window's colours.

plugin.id          = agent-tasks
plugin.name        = Agent-Tasks
plugin.version     = 1.0.0
plugin.vendor      = Unluminate
plugin.kind        = ui
plugin.description = A task board whose tickets are worked by an agent in a terminal Unluminate owns. Four lanes, cards with todos and comments, a terminal for each ticket, and a session that is resumed by the agent's own conversation id rather than by a process that outlives the editor.
plugin.limitations = The board is a tab in the editing area and has no pane, so it cannot be docked to an edge beside the explorer; it is opened from its menu or from its button in the rail. A description or a comment read as markdown shows headings, lists, quotes, tables and fenced code, and does not show pictures or Mermaid diagrams: resolving those needs the window to decode an image and lay a diagram out, which a plugin cannot do, so a picture shows the words that were written for it instead. The board is local to this machine and its database is one SQLite file, so it is a different board from the browser one and nothing syncs between them. Slack, the phone page and the browser login are absent: they are features of a server that serves other clients. A ticket's terminal ends when Unluminate closes, and Resume session starts a new one on the same agent conversation. Resume session works for Claude, which takes the session id it is given, and not for Codex, which names its own: a Codex ticket is started again rather than resumed, and the ticket's comments are what the new agent reads. JIRA needs three values in the machine's keychain, and with none configured every JIRA control is absent.

ui.provider = agent-tasks

# The decoration `egui` cannot draw: soft shadows, inset shadows, gradients and rounded clips, rendered by
# `services::vello_canvas`. Named from `plugins::CHROME`, checked, and refused with the list if this version
# of Unluminate has no such renderer — the rule `language.renders`, `run.project` and `debug.adapter` all keep.
# Take this line out and the board draws flat, in the same frame. See `tasks/agent-tasks-vello-ui-tdd.md`.
ui.chrome = vello

# The board is a **tab** in the editing area and nothing else. `task-28` asked for that plainly: it used to
# contribute a pane docked to the right as well, drawing the same board in a 420 point column with one lane
# showing at a time, and a board narrow enough to need sideways scrolling to see the second lane is a board
# nobody reads. Opened from the menu or from its own button in the rail, because there is no file to open.
#
# Unluminate's pane machinery is untouched — `app::plugin_panes`, the rail's contributed buttons and the dock's
# plugin slots are all still there, and `tasks/ui-plugin-architecture.md` still describes them. This plugin
# no longer asks for one.
tab.id    = board
tab.label = Agent-Tasks
# Which drawn icon its button in the rail uses, from the same list `pane.icon` names. The button lands in
# the rail's top group under whatever panes are there, which is where `task-28` asks for it.
tab.icon  = board

# The menu, added after Unluminate's own six. A lone `-` is a separator.
menu.name                = Agent-Tasks
# No `Sync JIRA` entry. JIRA is not implemented on this board, and Unluminate's rule is that a control which
# cannot apply is absent rather than present and refusing. `plugin.limitations` says so, and the day the
# sync exists the entry comes back here.
# One entry rather than two, since there is only one place the board is drawn now.
menu.entries             = open-tab=Open Board, -, reload=Reload Board
menu.submenu.new         = New
menu.submenu.new.entries = new-task=Task, new-epic=Epic, new-sprint=Sprint

# The page in Settings, which is where the database file is named.
settings.page = Agent-Tasks
settings.icon = board
