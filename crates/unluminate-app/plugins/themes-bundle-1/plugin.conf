# An Unluminate plugin that carries themes. See the JavaScript one for what a language plugin is and the
# Agent-Chat one for what a plugin that draws is; this one names no file type and contributes no pane. It
# says what every colour in Unluminate's own palette means.
#
# Every number below was read out of the theme plugin that ships it — the `.theme.json` and
# `colors/*.xml` inside `dracula-theme-1.19.0.jar`, the Material theme jar and
# `one-dark-theme-6.2.2.jar` — rather than off a web page. `tasks/task-1776-themes-tdd.md` §1 and §7 record
# which file each came from and the two places a number was deliberately not copied.
#
# A role that is not named keeps Unluminate Dark's, which is the reference editor's `parentTheme` in one line. A role Unluminate
# has not got is refused with the list, and a theme that colours some tokens and not others is refused too:
# eight of the nine would leave one line of code drawn in two schemes at once.

plugin.id          = themes-bundle-1
plugin.name        = Themes Bundle 1
plugin.version     = 1.0.0
plugin.vendor      = Unluminate
plugin.kind        = theme
plugin.description = Five dark themes taken from the theme plugins installed on this machine: Islands Dracula Colorful, Material Palenight, Material Deep Ocean, Monokai Pro and One Dark. Each one carries a whole palette, the nine token colours, and which of the two drawn icon sets it uses. Choose one in Settings under Appearance & Behavior, Theme.
plugin.limitations = All five are dark, and a manifest saying `dark = false` is refused rather than half-supported: Unluminate's window is drawn on a transparent ground, its depth is a surface lifted and a shadow of black, and every accepted screenshot is judged against a dark ground, so a light theme is not a palette swap. A theme colours the window and the tokens and nothing else - the terminal's sixteen ANSI colours are a different palette with a standard behind it, and a program that prints red expects red. The four colours a passage can be highlighted in do not move with the theme either, because a mark carries the colour it was made in and a document marked under one theme is read under another. Nothing here is fetched: a theme is data in a folder, exactly as a language is, and switching this plugin off puts the window back to Unluminate Dark in the same frame.

# The order they are listed in Settings, which is the manifest's rather than alphabetical.
themes = dracula, palenight, deep-ocean, monokai-pro, one-dark

# ---------------------------------------------------------------------------- Islands Dracula Colorful
# The one that is switched on in the reference editor on this machine: `options/laf.xml` names the theme id
# `8b2c3d4e-5f67-89ab-cdef-012345678901`, which `dracula-theme`'s own plugin.xml maps to
# `IslandsDraculaColorful.theme.json`, and `options/colors.scheme.xml` names `Dracula Colorful` as the
# editor scheme. Note the **blue** comment and braces: that is what makes Colorful different from plain
# Dracula, and a theme called Dracula carrying plain Dracula's `#6272A4` comment would be wrong in the one
# place it is noticed first.
#
# The editing area is the scheme's `#282A36` rather than the Islands theme's `#3A3D4C`. The reference editor's editor
# is an island floating on a darker frame and Unluminate has no such frame; the two lighter greys become the
# title bar and the panels, which is where they are in the picture anyway.
