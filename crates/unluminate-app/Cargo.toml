[package]
name = "unluminate-app"
description = "The Unluminate window: file explorer, editor surface, formatting toolbar, transparency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "unluminate"

[lib]
name = "unluminate_app"
path = "src/lib.rs"

[[bin]]
name = "unluminate"
path = "src/main.rs"

[dependencies]
unluminate-core.workspace = true
unluminate-dap.workspace = true
unluminate-git.workspace = true
unluminate-terminal.workspace = true
# The Agent-Chat plugin's half with no window in it: the endpoints, the two wire shapes, the
# server-sent-event framing, the conversation and the thread a request runs on.
unluminate-chat.workspace = true
# The Database plugin's half with no window in it: the PostgreSQL wire protocol, SQLite, the values a
# grid draws, and the thread a query runs on. See `tasks/task-1777-database-plugin-tdd.md` §2 for why
# the PostgreSQL client is written here rather than taken from `tokio-postgres`.
unluminate-db.workspace = true
# The catalogue of command line commands and the wire format, shared with the client so that the
# two cannot come to disagree about what a command is called. It brings no window with it.
unluminate-cli.workspace = true
serde_json.workspace = true
url.workspace = true
percent-encoding.workspace = true
mime_guess.workspace = true
egui.workspace = true
eframe.workspace = true
vello_cpu.workspace = true
fontdb.workspace = true
ab_glyph.workspace = true
unicode-segmentation.workspace = true
rfd.workspace = true
arboard.workspace = true
muda.workspace = true
# Only the PNG decoder, for the pictures plugins put in front of their files.
image.workspace = true
# The Agent-Tasks plugin's board. One file on disk, with SQLite compiled in.
rusqlite.workspace = true
# The one request Unluminate makes on its own behalf: whether a newer release exists, asked only when
# somebody asks for it. `services::update` uses `unluminate-chat`'s own TLS configuration rather than
# a second one -- see the note at the top of that file.
ureq = { workspace = true }
libc.workspace = true

# The application menu on macOS takes its name from the running program, and the program is `unluminate`. Setting
# the process name to `Unluminate` is what makes the menu bar read `Unluminate  File  Edit  View` rather than starting
# with a lower case q. Nothing else here needs Objective C.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation.workspace = true
wry.workspace = true
# Posting a block to the main dispatch queue, which is how a run loop that has stopped answering
# repaint requests is woken. See `services/wake.rs`.
dispatch2.workspace = true

# Clearing the window's redirection surface, which is what lets the desktop show through on Windows.
# See `services/windows_transparency.rs`.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
wry.workspace = true

# The icon and the version block inside `unluminate.exe`, put there by `build.rs`. Windows takes a
# program's icon, its taskbar name and its Add or Remove Programs version from a resource compiled
# into the executable, and nothing outside the executable can supply one.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[[example]]
name = "sample_design"
path = "examples/sample_design.rs"

[[example]]
name = "terminal_capture"
path = "examples/terminal_capture.rs"

[[example]]
name = "shrink"
path = "examples/shrink.rs"

[[example]]
name = "scale"
path = "examples/scale.rs"

[[example]]
name = "crop"
path = "examples/crop.rs"

[[example]]
name = "plugin_icon"
path = "examples/plugin_icon.rs"

[[example]]
name = "mermaid_check"
path = "examples/mermaid_check.rs"

[[example]]
name = "mermaid_texts"
path = "examples/mermaid_texts.rs"

[[example]]
name = "frame_cost"
path = "examples/frame_cost.rs"

[dev-dependencies]
egui_kittest.workspace = true
unluminate-dap.workspace = true
unluminate-git.workspace = true
image.workspace = true
