[package]
name = "quill-chat"
description = "A streaming chat client: the endpoints, the two wire shapes, the server-sent-event framing, the conversation and the thread a request runs on. No user interface dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Both wire shapes are open protocols other people's servers speak, so what crosses the wire is a
# value rather than a Rust type that happens to serialise. That is the choice `quill-dap` and
# `quill-cli/src/protocol.rs` already made, and this makes it a third time.
serde_json.workspace = true
# The one place an HTTP request is made. Blocking, because a worker thread wants a blocking read;
# `native-tls`, because that is schannel on Windows and Security.framework on macOS, so the
# certificates Quill trusts are the certificates the machine trusts — `quill-git`'s own argument for
# shelling out to the machine's real git. `gzip`, `json`, `cookies`, `multipart` and the proxies are
# all off: nothing here posts a form, keeps a cookie or wants a second JSON layer.
# See `tasks/task-1767-agent-chat-tdd.md` §3.1 for the two routes that were weighed and refused.
ureq = { workspace = true }
