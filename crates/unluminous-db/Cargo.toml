[package]
name = "unluminous-db"
description = "Reading and changing a database: the PostgreSQL wire protocol, SQLite, and the thread a query runs on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# SQLite's own C compiled in, which is already in the tree for the Agent-Tasks board: no server, no
# port and nothing to install.
rusqlite.workspace = true
# The PostgreSQL client's own arithmetic. `sha2` and `base64` are already in the tree — `sha2` through
# `wry` and `base64` through `alacritty_terminal` — so what this really adds is `hmac` and `md-5`,
# each a thin layer on the `digest` traits that are here already. Two crates, against roughly fifty
# for `tokio-postgres` and the runtime it brings with it.
sha2.workspace = true
hmac.workspace = true
md-5.workspace = true
base64.workspace = true
# The SCRAM client nonce, from the operating system. A nonce off a counter or the clock would weaken
# exactly the replay property the exchange exists for.
getrandom.workspace = true
# TLS from the machine's own store: schannel on Windows, Security.framework on macOS. The certificates
# a data source is checked against are then the certificates every other program on this machine
# trusts, which is the argument `ureq` is already chosen on.
native-tls.workspace = true

[dev-dependencies]
# The scripted server in `tests/scripted_server.rs` plays a real server's half of the SCRAM exchange,
# so it needs the same three primitives the client does. They are already dependencies above; naming
# them here is what lets the test file use them directly.
sha2.workspace = true
hmac.workspace = true
base64.workspace = true
