[package]
name = "quill-app"
description = "The Quill window: file explorer, editor surface, formatting toolbar, transparency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "quill"

[lib]
name = "quill_app"
path = "src/lib.rs"

[[bin]]
name = "quill"
path = "src/main.rs"

[dependencies]
quill-core.workspace = true
quill-terminal.workspace = true
egui.workspace = true
eframe.workspace = true
fontdb.workspace = true
ab_glyph.workspace = true
unicode-segmentation.workspace = true
rfd.workspace = true
arboard.workspace = true
muda.workspace = true

# The application menu on macOS takes its name from the running program, and the program is `quill`. Setting
# the process name to `Quill` is what makes the menu bar read `Quill  File  Edit  View` rather than starting
# with a lower case q. Nothing else here needs Objective C.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation.workspace = true

[[example]]
name = "sample_design"
path = "examples/sample_design.rs"

[[example]]
name = "terminal_capture"
path = "examples/terminal_capture.rs"

[[example]]
name = "shrink"
path = "examples/shrink.rs"

[[example]]
name = "scale"
path = "examples/scale.rs"

[[example]]
name = "crop"
path = "examples/crop.rs"

[dev-dependencies]
egui_kittest.workspace = true
image.workspace = true
