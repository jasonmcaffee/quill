# A Quill plugin. Plain `name = value`, the same format the settings file uses, and safe to edit by
# hand: Quill reads a plugin folder from %APPDATA%\Quill\plugins in preference to the copy bundled
# inside the program, so correcting this file is how a keyword gets added.

plugin.id          = javascript
plugin.name        = JavaScript
plugin.version     = 1.0.0
plugin.vendor      = Quill
plugin.kind        = language
plugin.description = Syntax colouring, a file icon and the Dracula colour scheme for JavaScript. Keywords, builtins, strings including template literals, numbers, line and block comments, function calls and types are told apart.
plugin.limitations = A regular expression literal is coloured as division, because the two cannot be told apart without parsing. Interpolation inside a template literal is coloured as part of the string. JSX is coloured as plain text.

language.extensions    = .js, .mjs, .cjs, .jsx
language.line_comment  = //
language.block_comment = /*, */
language.strings       = ", ', `
language.escapes       = true
language.numbers       = true
language.operators     = +-*/%=<>!&|^~?:;,.

language.keywords = const, let, var, function, class, extends, new, return, if, else, for, while, do, switch, case, default, break, continue, try, catch, finally, throw, typeof, instanceof, in, of, delete, void, async, await, yield, import, export, from, as, static, get, set, this, super, null, undefined, true, false, debugger, with

language.builtins = console, window, document, globalThis, process, module, require, Promise, Array, Object, String, Number, Boolean, Symbol, BigInt, Math, JSON, Date, RegExp, Map, Set, WeakMap, WeakSet, Error, TypeError, Infinity, NaN, setTimeout, setInterval, fetch

# Dracula. The background is deliberately not set: a colour scheme in Quill colours the tokens and
# not the editing area, because the window letting the desktop show through is the whole character
# of the product and an opaque scheme would take that away.
theme.name     = Dracula
theme.keyword  = #FF79C6
theme.builtin  = #BD93F9
theme.function = #50FA7B
theme.type     = #8BE9FD
theme.string   = #F1FA8C
theme.number   = #FFB86C
theme.comment  = #6272A4
theme.operator = #FF79C6
theme.text     = #F8F8F2
