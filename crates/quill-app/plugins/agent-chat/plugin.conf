# A Quill plugin that draws. See the JavaScript one for what a language plugin is; this one adds a
# pane, a menu and a Settings page instead of a file type.
#
# `ui.provider` names code that shipped inside Quill. The arrangement below is data and can be changed
# by hand; the drawing cannot, which is what stops a manifest deciding the window's colours.

plugin.id          = agent-chat
plugin.name        = Agent-Chat
plugin.version     = 1.0.0
plugin.vendor      = Quill
plugin.kind        = ui
plugin.description = A chat pane beside your work. The answer arrives a token at a time, a picture can be attached to either side of it, and with the tools switched on the model drives the window through Quill's own commands rather than through anything of its own.
plugin.limitations = Two wire shapes are spoken, `openai` and `anthropic`; an endpoint that speaks neither cannot be added, and Gemini's own shape is not among them. A key is never stored by Quill: an endpoint names an environment variable, or on macOS and Linux a keychain entry, and Windows has no keychain so the variable is the only route there. Markdown in an answer is drawn with headings, lists, quotes, tables and coloured fenced code, and does not draw pictures or Mermaid diagrams written inside the text: resolving those needs the window to decode an image and lay a diagram out. A picture attached to a message is drawn. One conversation at a time, with a history to switch between them; a message cannot be edited and re-sent. Nothing about the file you are looking at is sent except its path — with the tools on the model can read it by asking, and with them off it cannot. Speech, the microphone, web search and the datasource chips of the page this pane is modelled on are features of a server Quill has not got, so they are absent rather than present and refusing.

ui.provider = agent-chat

# The decoration `egui` cannot draw: soft shadows, inset shadows, gradients and rounded clips, rendered by
# `services::vello_canvas`. Named from `plugins::CHROME`, checked, and refused with the list if this version
# of Quill has no such renderer — the rule `language.renders`, `run.project` and `debug.adapter` all keep.
# Take this line out and the pane draws flat, in the same frame.
ui.chrome = vello

# The pane, docked to the right, with a button in the upper group of the rail. Both are what the
# ticket asks for in its first sentence, and both are data: dragging its header to another edge,
# `Move to` on its right click menu and `quill-cli plugins pane agent-chat/chat --side bottom` all
# work with no code here, because `task-1697` built them for every panel.
pane.id      = chat
pane.label   = Agent-Chat
pane.icon    = chat
pane.side    = right
pane.group   = top
pane.width   = 420
pane.height  = 320
pane.applies = always

# The menu, added after Quill's own six. A lone `-` is a separator.
menu.name    = Agent-Chat
# `open-pane` is the window's own name for "put this plugin's pane on the screen": Quill acts on it
# in `run_plugin_command`, so the menu entry, the rail button and `quill-cli plugins run agent-chat
# open-pane` are one path.
menu.entries = open-pane=Show Chat, new=New Conversation, -, stop=Stop Answering, -, tools=Toggle Quill Tools

# The page in Settings, which is where an endpoint's URL, model and key variable go.
settings.page = Agent-Chat
settings.icon = chat
