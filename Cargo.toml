[workspace]
resolver = "2"
members = ["crates/quill-core", "crates/quill-dap", "crates/quill-git", "crates/quill-terminal", "crates/quill-app", "quill-cli"]

[workspace.package]
version = "0.28.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
quill-core = { path = "crates/quill-core" }
quill-dap = { path = "crates/quill-dap" }
quill-git = { path = "crates/quill-git" }
quill-terminal = { path = "crates/quill-terminal" }
# The command catalogue and the wire format the CLI and the window share. It lives beside the client
# it belongs to rather than under `crates`, because `quill-cli/` holds the CLI's documentation as
# well as its code and the two are read together.
quill-cli = { path = "quill-cli" }
# `kill(pid, 0)` and nothing else: the one question a window asks about another window that owns a ticket's
# worker, which is whether it is still running.
libc = "0.2"
unicode-segmentation = "1.13"
# The Agent-Tasks plugin's database. `bundled` compiles SQLite's own C into Quill, so there is nothing
# to install, no server to be running and no port: the board is one file. See
# `tasks/agent-tasks-plugin-tdd.md` for why this rather than the PostgreSQL the application being
# replaced needs. Nothing is fetched at run time, which is the rule the whole repository keeps.
rusqlite = { version = "0.32", features = ["bundled"] }
# The control channel speaks JSON, one object a line. Written by hand rather than with the derive
# macros: nothing here is a Rust type going over the wire, it is a small open protocol another
# language has to be able to speak, so the values are built and read as values.
serde_json = "1.0"
url = "2.5"
percent-encoding = "2.3"
mime_guess = "2.0"
wry = { version = "0.56.1", default-features = false, features = ["os-webview"] }
# The board's decoration: soft shadows, inset shadows and gradients, which `epaint` cannot draw. The CPU
# renderer of the three Vellos, because it is the only one that can go in a window on egui 0.36 at all:
# `vello` and `vello_hybrid` both pin wgpu 29 and eframe pins wgpu 30, so their devices and textures are
# different types. It renders into premultiplied RGBA8, which is `egui::Color32` byte for byte, and it is
# deterministic, which is what the screenshot tests rest on. See `tasks/agent-tasks-vello-ui-tdd.md`.
#
# **The version is epaint's, and it has to be.** `epaint` 0.36 already depends on `vello_cpu` 0.1 — it
# rasterises the glyphs in its font atlas with it — so this renderer is already inside Quill and asking
# for 0.2 would put a second copy of it in the binary rather than adding a renderer. Follow epaint when
# egui is next upgraded.
#
# **And `multithreading` must stay off, which was measured rather than assumed.** It is the one big lever
# left — rasterising is per pixel and embarrassingly parallel, and turning it on took a board of four lanes
# and thirty-two cards from 20.1 ms to 5.5. It cannot be used. Cargo features are additive across the whole
# graph, so enabling it changes `RenderSettings::default()` for **epaint too** — and `epaint`'s glyph
# rasteriser builds its context with the default settings and never calls `flush()`, which the multithreaded
# dispatcher requires. Every screenshot test panicked inside `vello_cpu` with "attempted to rasterize before
# flushing", from egui's own text. See `tasks/agent-tasks-vello-ui-tdd.md` §9.
vello_cpu = { version = "0.1", default-features = false, features = ["std", "u8_pipeline"] }
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts"] }
fontdb = "0.24"
ab_glyph = "0.2"
arboard = "3.6"
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "ico",
    "webp",
    "tiff",
] }
rfd = "0.17"
muda = "0.19"
alacritty_terminal = "0.26"
unicode-width = "0.2"
winresource = "0.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    # Deleting a file to the Recycle Bin, which is `SHFileOperationW`. See `services/recycle.rs`.
    "Win32_UI_Shell",
    # `OpenProcess`, the Windows half of `owner_is_gone`'s `kill(pid, 0)` question. See
    # `services/agent_tasks/mod.rs`.
    "Win32_System_Threading",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSProcessInfo",
    "NSString",
] }
# Already in the tree under the objc2 crates; named here because `services/wake.rs` uses it directly.
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
