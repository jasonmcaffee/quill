[workspace]
resolver = "2"
members = ["crates/quill-core", "crates/quill-dap", "crates/quill-git", "crates/quill-terminal", "crates/quill-app", "quill-cli"]

[workspace.package]
version = "0.22.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
quill-core = { path = "crates/quill-core" }
quill-dap = { path = "crates/quill-dap" }
quill-git = { path = "crates/quill-git" }
quill-terminal = { path = "crates/quill-terminal" }
# The command catalogue and the wire format the CLI and the window share. It lives beside the client
# it belongs to rather than under `crates`, because `quill-cli/` holds the CLI's documentation as
# well as its code and the two are read together.
quill-cli = { path = "quill-cli" }
unicode-segmentation = "1.13"
# The control channel speaks JSON, one object a line. Written by hand rather than with the derive
# macros: nothing here is a Rust type going over the wire, it is a small open protocol another
# language has to be able to speak, so the values are built and read as values.
serde_json = "1.0"
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts"] }
fontdb = "0.24"
ab_glyph = "0.2"
arboard = "3.6"
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "ico",
    "webp",
    "tiff",
] }
rfd = "0.17"
muda = "0.19"
alacritty_terminal = "0.26"
unicode-width = "0.2"
winresource = "0.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    # Deleting a file to the Recycle Bin, which is `SHFileOperationW`. See `services/recycle.rs`.
    "Win32_UI_Shell",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSProcessInfo",
    "NSString",
] }
# Already in the tree under the objc2 crates; named here because `services/wake.rs` uses it directly.
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
